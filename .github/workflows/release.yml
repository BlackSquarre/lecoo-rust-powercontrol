name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to build and package
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: cargo build --release --locked --bin lecoo-control-center --bin hardware_test

      - name: Package and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ inputs.ref }}'
          if ([string]::IsNullOrWhiteSpace($version)) { $version = '${{ github.ref_name }}' }
          if ($version -match '^refs/tags/(v\d+\.\d+\.\d+)$') { $version = $Matches[1] }
          if ($version -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Expected a semantic version tag, got $version" }
          $packageName = "lecoo-rust-powercontrol-$version-windows-x64"
          $stage = Join-Path $env:RUNNER_TEMP $packageName
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item target/release/lecoo-control-center.exe, target/release/hardware_test.exe -Destination $stage
          $checksums = Get-ChildItem -LiteralPath $stage -File | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          $checksums | Set-Content -LiteralPath (Join-Path $stage 'SHA256SUMS.txt') -Encoding ASCII
          $archive = Join-Path $env:RUNNER_TEMP "$packageName.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal
          $zipHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $([IO.Path]::GetFileName($archive))" | Set-Content -LiteralPath "$archive.sha256" -Encoding ASCII
          "PACKAGE_ARCHIVE=$archive" >> $env:GITHUB_ENV
          "PACKAGE_CHECKSUM=$archive.sha256" >> $env:GITHUB_ENV
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view "$env:PACKAGE_VERSION" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:PACKAGE_VERSION" "$env:PACKAGE_ARCHIVE" "$env:PACKAGE_CHECKSUM" --clobber
          } else {
            $notes = "docs/releases/$env:PACKAGE_VERSION.md"
            if (Test-Path -LiteralPath $notes) {
              gh release create "$env:PACKAGE_VERSION" "$env:PACKAGE_ARCHIVE" "$env:PACKAGE_CHECKSUM" --verify-tag --title "$env:PACKAGE_VERSION — Lecoo Rust PowerControl" --notes-file "$notes"
            } else {
              gh release create "$env:PACKAGE_VERSION" "$env:PACKAGE_ARCHIVE" "$env:PACKAGE_CHECKSUM" --verify-tag --title "$env:PACKAGE_VERSION — Lecoo Rust PowerControl" --generate-notes
            }
          }
