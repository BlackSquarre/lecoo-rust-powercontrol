[package]
name = "lecoo-control-center"
version = "0.0.2"
edition = "2021"
default-run = "lecoo-control-center"
authors = ["BlackSquarre"]
description = "Rust-powered unofficial Windows power control center for compatible Lecoo systems"

[dependencies]
# GUI
eframe = { version = "0.30", features = ["default_fonts"] }
egui = "0.30"
egui_extras = "0.30"

# Windows API
windows = { version = "0.58", features = [
    "Win32_System_Com",
    "Win32_System_Wmi",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_ProcessStatus",
    "Win32_UI_WindowsAndMessaging",
] }

# System monitoring
sysinfo = "0.33"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
raw-window-handle = "0.6"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"         # Optimize for size
lto = true              # Link Time Optimization
codegen-units = 1       # Single codegen unit for better optimization
strip = true            # Strip symbols
panic = "abort"         # Smaller panic handler

[profile.dev]
opt-level = 1           # Some optimization for dev builds
