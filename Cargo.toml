[package]
name = "lecoo-control-center"
version = "0.1.0"
edition = "2021"
default-run = "lecoo-control-center"
authors = ["BlackSquarre"]
description = "Rust-powered unofficial Windows power control center for compatible Lecoo systems"

[dependencies]
# Historical allocation experiments only; not linked into the native application.
eframe = { version = "0.30", features = ["default_fonts"], optional = true }

# Windows API
windows = { version = "0.58", features = [
    "Win32_Globalization",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Wmi",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_System_TaskScheduler",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# System monitoring
sysinfo = { version = "0.33", optional = true }

# Error handling
anyhow = "1.0"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"

[build-dependencies]
winres = "0.1"
toml = "0.5.11"

[dev-dependencies]
toml = "0.5.11"

[features]
legacy-memory-probe = ["dep:eframe", "dep:sysinfo"]

[[bin]]
name = "memory_probe"
path = "src/bin/memory_probe.rs"
required-features = ["legacy-memory-probe"]

[profile.release]
opt-level = "z"         # Optimize for size
lto = true              # Link Time Optimization
codegen-units = 1       # Single codegen unit for better optimization
strip = true            # Strip symbols
panic = "abort"         # Smaller panic handler

[profile.dev]
opt-level = 1           # Some optimization for dev builds
